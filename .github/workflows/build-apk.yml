name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
          sdkmanager --list_installed | tail -20

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Patch ggml for the 32-bit ARM toolchain
        run: |
          # ggml's own AArch32 fallbacks in ggml-cpu-impl.h stay untouched: with the armv8
          # variant set disabled they no longer collide, and arch/arm/repack.cpp needs them.
          python3 scripts/ci-patch-ggml-arm32-quants.py third_party/llama.cpp/ggml/src/ggml-cpu/arch/arm/quants.c

      - name: Prepare tokenizers-cpp Rust toolchain
        run: |
          set -e
          rustup target add aarch64-linux-android armv7-linux-androideabi
          # cargo resolves a target-triple linker from the triple itself, but the NDK ships
          # the 32-bit ARM driver as armv7a-linux-androideabi<api>-clang. Add the alias the
          # Rust build system looks for so onig_sys/tokenizers cross-compile for v7a.
          NDK_BIN="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/29.0.13113456}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls "$NDK_BIN" > /dev/null
          for pair in "armv7-linux-androideabi:armv7a-linux-androideabi" ; do
            want="${pair%%:*}"; have="${pair##*:}"
            for api in 26 21; do
              for suffix in clang clang++; do
                if [ -x "$NDK_BIN/${have}${api}-${suffix}" ] && [ ! -e "$NDK_BIN/${want}${api}-${suffix}" ]; then
                  ln -s "$NDK_BIN/${have}${api}-${suffix}" "$NDK_BIN/${want}${api}-${suffix}"
                fi
              done
            done
          done
          cd third_party/tokenizers-cpp/rust
          cargo generate-lockfile

      - name: Assemble APK
        env:
          # The cc crate (onig_sys) and cargo both derive their assembler/linker from the Rust
          # target triple. The NDK names the 32-bit ARM driver armv7a-*, so pin the toolchain
          # explicitly instead of relying on a symlink inside the SDK directory.
          NDK_BIN: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin
          CC_armv7_linux_androideabi: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang
          CXX_armv7_linux_androideabi: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang++
          AR_armv7_linux_androideabi: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang
        run: |
          NDK_BIN="${ANDROID_HOME}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SRC=$(ls "$NDK_BIN"/armv7a-linux-androideabi*-clang 2>/dev/null | head -1)
          echo "armv7a driver: ${SRC:-none}"
          if [ -n "$SRC" ]; then
            # Rust/cc derive the linker from the target triple (armv7-linux-androideabi), while
            # the NDK ships armv7a-linux-androideabi<api>-clang. Publish the alias the build
            # actually looks for, for every API level the project may use.
            sudo ln -sf "$SRC" "${NDK_BIN}/armv7-linux-androideabi26-clang"
            sudo ln -sf "${SRC}" "${NDK_BIN}/armv7-linux-androideabi21-clang"
            sudo ln -sf "${SRC}++" "${NDK_BIN}/armv7-linux-androideabi26-clang++"
            ls -l "${NDK_BIN}/armv7-linux-androideabi26-clang"
          fi
          for attempt in 1 2 3; do
            ./gradlew :app:assembleDebugDist \
              -PmcaQnnTypedBindingsRequired=false \
              -PmcaMnnVendorRequired=false \
              -PmcaWithMnnDiffusion=false \
              -Pmca.abis=arm64-v8a,armeabi-v7a \
              -PmcaSdNative=false \
              -Pmca.composeCompilerReports=false \
              --stacktrace && break || { echo "gradle attempt $attempt failed"; [ $attempt -lt 3 ] && sleep 20; }
          done

      - name: Sign and verify APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/muyu.jks"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=$(ls app/build/outputs/apk/debugDist/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$APK" dist/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/muyu.jks" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out dist/MuYu-Agent-0.4.0-universal.apk dist/aligned.apk
          rm -f dist/aligned.apk
          "$BT/apksigner" verify --print-certs dist/MuYu-Agent-0.4.0-universal.apk
          cd dist && sha256sum MuYu-Agent-0.4.0-universal.apk > MuYu-Agent-0.4.0-universal.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MuYu-Agent-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MuYu-Agent ${GITHUB_REF_NAME}" \
            --notes "MuYu-Agent ${GITHUB_REF_NAME}：通用安装包（arm64-v8a + armeabi-v7a 32 位）。"
